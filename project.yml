# Fallback project definition for XcodeGen.
#
# The checked-in Closet.xcodeproj should open directly in Xcode 16 or later.
# If it ever gets corrupted or you'd rather generate it, install XcodeGen
# (`brew install xcodegen`) and run `xcodegen generate` in this directory.
name: Closet
options:
  bundleIdPrefix: com.caito360
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Closet:
    type: application
    platform: iOS
    sources:
      - path: Closet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.caito360.closet
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: true
        ENABLE_PREVIEWS: true
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: Closet
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: >-
          Closet uses the camera so you can scan a piece of clothing and have its
          type and colour filled in for you.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: >-
          Closet reads photos you choose so it can add those clothes to your closet.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: >-
          Closet checks the weather where you are so it can recommend clothes that
          suit the conditions.
